default: &default
  adapter: sqlserver
  mode: ADONET
  azure: false
  timeout: 5000
  host: localhost
  database: CoffeeShopPOS
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
  port: 49685
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default

test:
  <<: *default
  database: CoffeeShopPOS_Test
